# main ga har push'da ilovani GitHub Pages'ga joylaydi: https://<foydalanuvchi>.github.io/<repo>/
# Bir martalik sozlash: Settings → Pages → Source: "GitHub Actions"
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Settings → Secrets and variables → Actions → Variables: API_URL (masalan https://gymbos-api.onrender.com),
          # TG_BOT (bot nomi, @siz), TG_APP (Mini App qisqa nomi, bo'lsa). Bo'sh bo'lsa — ilova serversiz ishlaydi
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_TG_BOT: ${{ vars.TG_BOT || 'gym_bosbot' }}
          VITE_TG_APP: ${{ vars.TG_APP }}
      # ichki sahifaga to'g'ridan-to'g'ri kirilganda ham ilova ochilsin
      - run: cp dist/index.html dist/404.html
      # 26-noyabrda ilova qisqa vaqt app/ manzilida turdi: o'sha yerda ro'yxatdan o'tgan xizmat ishchisi keshini tozalab, o'zini o'chiradi
      - run: |
          mkdir -p dist/app
          printf '%s\n' \
            "self.addEventListener('install', function () { self.skipWaiting(); });" \
            "self.addEventListener('activate', function (e) { e.waitUntil((async function () {" \
            "  var s = self.registration.scope, keys = await caches.keys();" \
            "  await Promise.all(keys.filter(function (k) { return k.indexOf(s) >= 0; }).map(function (k) { return caches.delete(k); }));" \
            "  await self.registration.unregister();" \
            "  (await self.clients.matchAll({ type: 'window' })).forEach(function (c) { c.navigate(c.url.replace('/app/', '/')); });" \
            "})()); });" > dist/app/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
