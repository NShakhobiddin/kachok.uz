# main ga har push'da GitHub Pages'ga joylaydi:
#   https://<foydalanuvchi>.github.io/<repo>/      — reklama sayti (site/)
#   https://<foydalanuvchi>.github.io/<repo>/app/  — ilovaning brauzer versiyasi
# O'z domeni ulansa (Settings → Pages → Custom domain), manzillar o'zi moslashadi: sayt — domen ildizida, ilova — /app/.
# Bir martalik sozlash: Settings → Pages → Source: "GitHub Actions"
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Pages manzili: base_path — "/kachok.uz" (yoki o'z domenida ""), base_url — to'liq manzil
      - id: pages
        uses: actions/configure-pages@v5
      - name: Ilova (app/)
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/app/
          # Settings → Secrets and variables → Actions → Variables: API_URL (masalan https://gymbos-api.onrender.com),
          # TG_BOT (bot nomi, @siz), TG_APP (Mini App qisqa nomi, bo'lsa). Bo'sh bo'lsa — ilova serversiz ishlaydi
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_TG_BOT: ${{ vars.TG_BOT || 'gym_bosbot' }}
          VITE_TG_APP: ${{ vars.TG_APP }}
      - name: Sayt (ildiz)
        run: npm run build:site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_TG_BOT: ${{ vars.TG_BOT || 'gym_bosbot' }}
      - name: Birlashtirish
        run: node scripts/compose-pages.mjs _site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
